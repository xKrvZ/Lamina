[workspace]
resolver = "2"
members = [
    "crates/lamina",
    "crates/lamina-test-gpu",
]
default-members = ["crates/lamina"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Lamina Contributors"]

[workspace.dependencies]
lamina = { path = "crates/lamina" }
lamina-test-gpu = { path = "crates/lamina-test-gpu" }

glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"

wgpu = "24"

[profile.release]
lto = "thin"
codegen-units = 1
